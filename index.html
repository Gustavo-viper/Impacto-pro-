<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b10">
  <meta name="description" content="Impacto Pro Orçamentos">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/impacto-pro-app-icon.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="./style.css">
  <title>Impacto Pro Orçamentos</title>
</head>
<body>
  <div id="login">
    <div class="loginbox">
      <img class="loginlogo" src="./assets/impacto-pro-logo.jpeg" alt="Impacto Pro Orçamentos">
      <h1>Impacto Pro Orçamentos</h1>
      <p class="muted">Acesso administrativo</p>
      <input id="u" type="text" autocomplete="username" placeholder="Usuário">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Senha" onkeydown="if(event.key==='Enter')login()">
      <button type="button" onclick="login()">Entrar</button>
      <small>Usuário: admin &nbsp;•&nbsp; Senha: 1234</small>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside>
      <img class="sidelogo" src="./assets/impacto-pro-logo.jpeg" alt="Impacto Pro">
      <nav>
        <button onclick="page('dash')">Dashboard</button>
        <button onclick="page('quotes')">Orçamentos</button>
        <button onclick="page('clients')">Clientes</button>
        <button onclick="page('stock')">Estoque</button>
        <button onclick="page('optionals')">Opcionais</button>
        <button onclick="page('rent')">Equipamentos alugados</button>
        <button onclick="page('history')">Histórico</button>
      </nav>
      <button class="logout" onclick="location.reload()">Sair</button>
    </aside>

    <main>
      <header>
        <div>
          <h1 id="title">Dashboard</h1>
          <span>Impacto Pro Orçamentos</span>
        </div>
        <div class="header-actions">
          <span id="net">● Offline</span>
          <button class="downloadbtn" onclick="downloadSystem()">Baixar sistema</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
